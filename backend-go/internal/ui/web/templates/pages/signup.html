{{define "content"}}
<section class="auth-card">
  <h1>Create account</h1>
  <p class="sub">Start practising past-paper questions in under a minute.</p>
  <form hx-post="/ui/signup/" hx-target="#form-error" hx-swap="innerHTML" method="post" action="/ui/signup/">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="email" required>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="new-password" required minlength="8">
    <div id="form-error" class="form-error">{{if .Error}}{{template "error.html" .}}{{end}}</div>
    <button class="btn full" type="submit">Create account</button>
  </form>
  <p class="alt">Already registered? <a href="/ui/login/">Sign in</a></p>
</section>
{{end}}
