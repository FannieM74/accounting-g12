{{define "content"}}
<section class="-mx-6 -my-9 min-h-[calc(100vh-190px)] bg-gradient-to-br from-slate-50 to-blue-50 text-slate-900">
  <div class="mx-auto max-w-2xl px-4 py-8">
    <div class="mb-6 text-center">
      <h1 class="mb-2 text-balance text-3xl font-bold text-slate-900">Start a quiz</h1>
      <p class="mx-auto max-w-lg text-sm leading-relaxed text-slate-500">Pick a topic or practise everything. Questions come from the real Nov 2022–2025 DBE Paper 1 exams.</p>
    </div>

    <section class="mb-6 rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
      <form method="post" action="/ui/quiz/start" class="space-y-4">
        <div>
          <label for="topic" class="mb-1.5 block text-sm font-medium text-slate-700">Topic</label>
          <select id="topic" name="topic" class="w-full rounded-lg border border-slate-200 bg-white px-3 py-2.5 text-sm text-slate-900 shadow-sm outline-none transition-colors focus:border-blue-500 focus:ring-2 focus:ring-blue-200">
            <option value="">All topics (170 questions)</option>
            {{$topics := .Topics}}
            {{$sel := .SelectedTopic}}
            {{range $t := $topics}}
              <option value="{{$t.Key}}" {{if eq $t.Key $sel}}selected{{end}}>{{$t.Key}} ({{$t.Count}})</option>
            {{end}}
          </select>
        </div>

        <div>
          <label for="count" class="mb-1.5 block text-sm font-medium text-slate-700">Number of questions</label>
          <select id="count" name="count" class="w-full rounded-lg border border-slate-200 bg-white px-3 py-2.5 text-sm text-slate-900 shadow-sm outline-none transition-colors focus:border-blue-500 focus:ring-2 focus:ring-blue-200">
            <option value="10">10 — quick round</option>
            <option value="20">20 — standard</option>
            <option value="30">30 — long</option>
          </select>
        </div>

        <button class="block w-full rounded-lg bg-blue-600 py-3 text-center font-medium text-white transition-colors hover:bg-blue-700 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500" type="submit">Start Quiz</button>
      </form>
    </section>

    <section class="rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
      <h2 class="mb-4 text-base font-semibold text-slate-900 sm:text-lg">Topics</h2>
      <div class="grid grid-cols-2 gap-3">
        {{$topics := .Topics}}
        {{range $t := $topics}}
        <a href="/ui/quiz?topic={{$t.Key}}" class="rounded-lg border border-slate-200 p-3 text-center text-sm text-slate-700 transition-colors hover:border-blue-300 hover:bg-blue-50 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500">
          <span class="block font-semibold text-blue-700">{{$t.Key}}</span>
          <span class="mt-1 block text-xs text-slate-400">{{$t.Count}} questions</span>
        </a>
        {{end}}
      </div>
    </section>
  </div>
</section>
{{end}}
